<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brand-grad)" filter="url(#shadow)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Healthcare Cross / Trend Graph Composite Icon -->
  <g transform="translate(136, 120)">
    <!-- Vertical Medical Bar -->
    <rect x="96" y="24" width="48" height="224" rx="24" fill="#ffffff"/>
    <!-- Horizontal Medical Bar -->
    <rect x="24" y="96" width="192" height="48" rx="24" fill="#ffffff"/>
    
    <!-- Dynamic Growth Trend Arrow Overlay -->
    <path d="M 32 200 L 96 136 L 144 168 L 224 88" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 176 88 H 224 V 136" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
